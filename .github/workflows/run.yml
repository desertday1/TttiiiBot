name: Run Wikipedia Move Fixer Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: إعداد ملفات تسجيل الدخول
        run: |
          echo "password_file = None" >> user-config.py
          echo "authenticate['ar.wikipedia.org'] = ('TttiiiBot@TttiiiBot', 'b8up1hiff5mqak261khdppe4rvmcpetc')" >> user-config.py

      - name: تشغيل البوت لإصلاح النقولات
        run: python bot.py
