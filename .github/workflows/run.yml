name: Run Wikipedia Move Fixer Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: توليد ملفات الإعدادات وكلمة السر
        run: |
          echo "family = 'wikipedia'" > user-config.py
          echo "mylang = 'ar'" >> user-config.py
          echo "usernames['wikipedia']['ar'] = 'TttiiiBot'" >> user-config.py
          echo "password_file = 'user-password.py'" >> user-config.py
          
          echo "('TttiiiBot', 'TttiiiBot@TttiiiBot', '${{ secrets.WIKI_PASSWORD }}')" > user-password.py

      - name: تشغيل البوت لإصلاح النقولات
        run: python bot.py
